<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 800'>
    <!-- фон неба -->
    <defs>
      <linearGradient id='bg' x1='0' y1='0' x2='0' y2='1'>
        <stop offset='0%' stop-color='#0b1020'/>
        <stop offset='100%' stop-color='#111833'/>
      </linearGradient>
    </defs>
    <rect width='1200' height='800' fill='url(#bg)'/>

    <!-- звезды (фиксированные координаты) -->
    <g fill='white' opacity='0.9'>
      <circle cx='80' cy='120' r='1.6'/>
      <circle cx='180' cy='60' r='1.2'/>
      <circle cx='260' cy='200' r='1.4'/>
      <circle cx='360' cy='90' r='1.1'/>
      <circle cx='520' cy='140' r='1.5'/>
      <circle cx='640' cy='60' r='1.8'/>
      <circle cx='780' cy='130' r='1.2'/>
      <circle cx='920' cy='80' r='1.4'/>
      <circle cx='1080' cy='160' r='1.6'/>
      <circle cx='1140' cy='40' r='1.1'/>
      <circle cx='150' cy='320' r='1.2'/>
      <circle cx='340' cy='300' r='1.4'/>
      <circle cx='560' cy='280' r='1.2'/>
      <circle cx='740' cy='260' r='1.6'/>
      <circle cx='980' cy='300' r='1.3'/>
    </g>

    <!-- полумесяц -->
    <g transform='translate(980,150)'>
      <circle r='40' fill='#f2f4ff' opacity='0.9'/>
      <circle r='40' cx='14' fill='#0b1020'/>
    </g>

    <!-- ракета -->
    <g transform='translate(350,520) rotate(-18)'>
      <!-- пламя -->
      <path d='M0 80 C 14 100, 26 120, 0 140 C -26 120, -14 100, 0 80' fill='#f7a600'/>
      <path d='M0 90 C 10 110, 18 124, 0 134 C -18 124, -10 110, 0 90' fill='#ffd34d'/>

      <!-- сопло -->
      <rect x='-18' y='60' width='36' height='22' rx='4' fill='#8b8fa3'/>

      <!-- корпус -->
      <rect x='-28' y='-80' width='56' height='140' rx='28' fill='#e8ecff' stroke='#aab3d6' stroke-width='2'/>
      <!-- иллюминатор -->
      <circle cx='0' cy='-20' r='16' fill='#6aa1ff' stroke='#2b4e9e' stroke-width='2'/>
      <circle cx='-5' cy='-24' r='4' fill='white' opacity='0.7'/>

      <!-- крылья -->
      <path d='M-28 30 L-70 70 L-28 60 Z' fill='#ff4d6d'/>
      <path d='M28 30 L70 70 L28 60 Z' fill='#ff4d6d'/>
    </g>

    <!-- подпись -->
    <g font-family='system-ui, -apple-system, Segoe UI, Roboto, sans-serif' fill='white' text-anchor='middle'>
      <text x='50%' y='86%' font-size='40' font-weight='700' opacity='0.95'>NASA APOD</text>
      <text x='50%' y='91%' font-size='22' opacity='0.8'>Don't share url for this picture.😞 </text>
    </g>
  </svg>